[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spwd"
version = "2.3.1"
description = "SuperPriceWatchdog bot and pipeline modules"
license = { text = "MIT" }
authors = [{ name = "Jack Chan" }]
requires-python = "~=3.12.0"
dependencies = [
    "python-dotenv==1.2.2",
    "pytz==2026.2",
    "requests==2.34.0",
    "supabase==2.30.0",
]

[project.optional-dependencies]
bot = [
    "Flask==3.1.3",
    "matplotlib==3.10.9",
]
pipeline = [
    "luigi==3.8.1",
    "polars[rtcompat]==1.40.1",
]

[tool.setuptools.packages.find]
include = ["spwd*"]
