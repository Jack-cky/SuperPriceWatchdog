name: Scheduled Pipeline
on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"
      timezone: "Asia/Hong_Kong"

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    environment: prod-pipeline
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Wake bot app
        continue-on-error: true
        env:
          BOT_URL: ${{ secrets.FORWARDING_URL }}
        run: |
          curl --silent --show-error --fail-with-body \
            --retry 3 \
            --connect-timeout 10 \
            --max-time 30 \
            "${BOT_URL:?}/health"

      - name: Prepare runtime files
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SCHEMA: ${{ secrets.SUPABASE_SCHEMA }}
        run: |
          mkdir -p config data logs
          cat > config/.env <<EOF
          SUPABASE_URL=${SUPABASE_URL:?}
          SUPABASE_KEY=${SUPABASE_KEY:?}
          SUPABASE_SCHEMA=${SUPABASE_SCHEMA:?}
          EOF

      - name: Pull pipeline image
        run: |
          for i in 1 2 3; do
            make pull && exit 0
            sleep 10
          done
          exit 1

      - name: Run pipeline
        run: |
          HOST_UID="$(id -u)"
          HOST_GID="$(id -g)"
          export HOST_UID HOST_GID
          make pipeline

      - name: Trigger alerts
        if: success()
        env:
          API_SECRET: ${{ secrets.API_SECRET }}
          BOT_URL: ${{ secrets.FORWARDING_URL }}
        run: |
          test -n "$API_SECRET"
          curl --silent --show-error --fail-with-body \
            --retry 3 \
            --connect-timeout 10 \
            --max-time 30 \
            -X POST \
            -H "X-Internal-Token: $API_SECRET" \
            "${BOT_URL:?}/api/v1/alert"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pipeline-artifacts
          path: |
            logs/
            data/
          retention-days: 7
